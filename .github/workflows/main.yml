name: 🐳 Build and Test C++ Bank Management (Docker CI)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:   # 👈 This line adds the "Run workflow" button manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t bank-management .

      - name: Run Docker container
        run: |
          docker run bank-management || echo "Container ran successfully"
